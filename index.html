<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registro Lotti</title>


<style>

body{
font-family:Arial,sans-serif;
padding:20px;
max-width:700px;
margin:auto;
}

button{
width:100%;
padding:15px;
font-size:18px;
margin-bottom:15px;
cursor:pointer;
}

button:disabled{
opacity:0.5;
cursor:not-allowed;
}

textarea{
width:100%;
height:180px;
font-size:16px;
box-sizing:border-box;
padding:10px;
}

#stato{
font-size:16px;
margin-bottom:15px;
font-weight:bold;
}

</style>

</head>


<body>


<h2 id="titolo">
Registro Lotti
</h2>


<div id="stato">
Pronto
</div>


<button id="bottoneParla">
🎤 PARLA
</button>


<textarea
id="testo"
placeholder="Dettatura..."
></textarea>


<button id="bottoneSalva">
SALVA
</button>


<script>


/* ============================================================
   URL GOOGLE APPS SCRIPT
============================================================ */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbz22zU9O2gsBLtlHZC92imCmLuO0haOaWNpge0j2rN3p7IlK8w2swFOCV2-Is6afqg/exec";


/* ============================================================
   VARIABILI VOCE
============================================================ */

let riconoscimento = null;

let registrazioneAttiva = false;

let arrestoManuale = false;


/*
   Testo definitivo già riconosciuto.
*/

let testoRiconosciuto = "";


/* ============================================================
   AVVIA VOCE
============================================================ */

function avviaVoce(){

  if(
    !("webkitSpeechRecognition" in window) &&
    !("SpeechRecognition" in window)
  ){

    alert(
      "Il browser non supporta la registrazione vocale."
    );

    return;

  }


  /*
     Se era già attivo, lo fermiamo.
  */

  if(registrazioneAttiva){

    fermaVoce();

    return;

  }


  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  riconoscimento =
    new SpeechRecognition();


  riconoscimento.lang =
    "it-IT";


  /*
     Permette di parlare più a lungo
     e fare pause.
  */

  riconoscimento.continuous =
    true;


  /*
     Ci permette di visualizzare
     anche il testo provvisorio.
  */

  riconoscimento.interimResults =
    true;


  riconoscimento.maxAlternatives =
    1;


  arrestoManuale =
    false;


  /* ========================================================
     START
  ======================================================== */

  riconoscimento.onstart =
  function(){

    registrazioneAttiva =
      true;

    document
      .getElementById("stato")
      .innerText =
      "🎤 Registrazione attiva — puoi fare pause.";

    document
      .getElementById("bottoneParla")
      .innerText =
      "🛑 FERMA REGISTRAZIONE";

  };


  /* ========================================================
     RISULTATI
  ======================================================== */

  riconoscimento.onresult =
  function(event){

    let nuoviFinali = "";


    /*
       resultIndex indica da quale risultato
       iniziare a leggere.

       Questo evita di duplicare
       quello che è già stato riconosciuto.
    */

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      const risultato =
        event.results[i];


      const testo =
        risultato[0]
          .transcript
          .trim();


      if(
        risultato.isFinal
      ){

        if(testo){

          nuoviFinali +=
            " " +
            testo;

        }

      }

    }


    /*
       Aggiungiamo SOLO i risultati definitivi.
    */

    if(nuoviFinali.trim()){

      testoRiconosciuto =
        (
          testoRiconosciuto +
          nuoviFinali
        )
        .trim();

    }


    /*
       Costruiamo il testo da mostrare.
    */

    let testoVisualizzato =
      testoRiconosciuto;


    /*
       Mostriamo anche eventuali risultati
       provvisori.
    */

    let provvisori = "";


    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      const risultato =
        event.results[i];


      if(
        !risultato.isFinal
      ){

        const testo =
          risultato[0]
            .transcript
            .trim();


        if(testo){

          provvisori +=
            " " +
            testo;

        }

      }

    }


    if(provvisori.trim()){

      testoVisualizzato =
        (
          testoVisualizzato +
          provvisori
        )
        .trim();

    }


    document
      .getElementById("testo")
      .value =
      testoVisualizzato;

  };


  /* ========================================================
     ERRORE
  ======================================================== */

  riconoscimento.onerror =
  function(event){

    console.log(
      "SpeechRecognition:",
      event.error
    );


    /*
       Una pausa senza voce non deve
       cancellare ciò che abbiamo già detto.
    */

    if(
      event.error === "no-speech"
    ){

      document
        .getElementById("stato")
        .innerText =
        "🎤 Pausa — puoi continuare a parlare.";

      return;

    }


    if(
      event.error === "aborted"
    ){

      return;

    }


    if(
      event.error === "not-allowed"
    ){

      alert(
        "Il microfono non è autorizzato. Controlla i permessi del browser."
      );

      return;

    }


    document
      .getElementById("stato")
      .innerText =
      "Errore microfono: " +
      event.error;

  };


  /* ========================================================
     FINE SESSIONE
  ======================================================== */

  riconoscimento.onend =
  function(){

    /*
       Se NON abbiamo premuto FERMA,
       il browser potrebbe aver chiuso
       la sessione da solo.

       In questo caso la riapriamo.
       
       Il testoRiconosciuto NON viene
       cancellato.
    */

    if(
      !arrestoManuale &&
      registrazioneAttiva
    ){

      try{

        riconoscimento.start();

        return;

      }catch(e){

        console.log(e);

      }

    }


    registrazioneAttiva =
      false;


    document
      .getElementById("bottoneParla")
      .innerText =
      "🎤 CONTINUA REGISTRAZIONE";


    document
      .getElementById("stato")
      .innerText =
      "Registrazione terminata. Il testo è stato mantenuto.";

  };


  try{

    riconoscimento.start();

  }catch(e){

    console.log(e);

  }

}


/* ============================================================
   FERMA VOCE
============================================================ */

function fermaVoce(){

  arrestoManuale =
    true;


  registrazioneAttiva =
    false;


  if(
    riconoscimento
  ){

    try{

      riconoscimento.stop();

    }catch(e){

      console.log(e);

    }

  }


  document
    .getElementById("bottoneParla")
    .innerText =
    "🎤 CONTINUA REGISTRAZIONE";


  document
    .getElementById("stato")
    .innerText =
    "Registrazione terminata. Il testo è stato mantenuto.";

}


/* ============================================================
   PULSANTE PARLA
============================================================ */

document
  .getElementById("bottoneParla")
  .addEventListener(
    "click",
    function(){

      if(
        registrazioneAttiva
      ){

        fermaVoce();

      }else{

        /*
           Se c'è già del testo nel box
           e premi CONTINUA, lo manteniamo.
        */

        const testoBox =
          document
            .getElementById("testo")
            .value
            .trim();


        if(
          testoBox &&
          !testoRiconosciuto
        ){

          testoRiconosciuto =
            testoBox;

        }


        avviaVoce();

      }

    }
  );


/* ============================================================
   PAGINA NUOVO LOTTO
============================================================ */

window.onload =
function(){

  const parametri =
    new URLSearchParams(
      window.location.search
    );


  if(
    parametri.get("azione") === "nuovo"
  ){

    document
      .getElementById("titolo")
      .innerHTML =
      "Nuovo lotto pronto";


    document
      .getElementById("bottoneParla")
      .innerHTML =
      "🎤 AVVIA REGISTRAZIONE";

  }

};


/* ============================================================
   NORMALIZZAZIONE TESTO
============================================================ */

function normalizzaTesto(testo){

  testo =
    testo.toLowerCase();


  testo =
    testo.replaceAll(
      "produzioni",
      "produzione"
    );


  testo =
    testo.replaceAll(
      "ingredienti",
      "ingrediente"
    );


  testo =
    testo.replaceAll(
      "nuovi ingredienti",
      "nuovo ingrediente"
    );


  testo =
    testo.replaceAll(
      "nuovi ingrediente",
      "nuovo ingrediente"
    );


  testo =
    testo.replaceAll(
      "nuova ingrediente",
      "nuovo ingrediente"
    );


  /*
     Correzioni "lotto".
  */

  testo =
    testo.replaceAll(
      "l'otto",
      "lotto"
    );


  testo =
    testo.replaceAll(
      "l otto",
      "lotto"
    );


  testo =
    testo.replaceAll(
      "l'8",
      "lotto"
    );


  testo =
    testo.replaceAll(
      "l 8",
      "lotto"
    );


  testo =
    testo.replaceAll(
      " l8 ",
      " lotto "
    );


  testo =
    testo.replaceAll(
      "lottof",
      "lotto f"
    );


  testo =
    testo.replaceAll(
      "lottol",
      "lotto l"
    );


  testo =
    testo.replaceAll(
      "ingrediente e ",
      "ingrediente "
    );


  testo =
    testo.replaceAll(
      " e anche ",
      " "
    );


  testo =
    testo.replaceAll(
      "categoria ",
      ""
    );


  return testo.trim();

}


/* ============================================================
   ESTRAI CATEGORIA
============================================================ */

function estraiCategoria(testo){

  const posizione =
    testo.indexOf(
      "produzione"
    );


  if(
    posizione < 0
  ){

    return "";

  }


  return testo
    .substring(
      0,
      posizione
    )
    .trim();

}


/* ============================================================
   ESTRAI PRODUZIONE
============================================================ */

function estraiProduzione(testo){

  const posizione =
    testo.indexOf(
      "produzione"
    );


  if(
    posizione < 0
  ){

    return "";

  }


  const inizio =
    posizione +
    "produzione".length;


  const fine =
    testo.indexOf(
      " quantità ",
      inizio
    );


  if(
    fine < 0
  ){

    return "";

  }


  return testo
    .substring(
      inizio,
      fine
    )
    .trim();

}


/* ============================================================
   ESTRAI QUANTITÀ
============================================================ */

function estraiQuantita(testo){

  const posizione =
    testo.indexOf(
      "quantità "
    );


  if(
    posizione < 0
  ){

    return "";

  }


  const inizio =
    posizione +
    "quantità ".length;


  /*
     La quantità termina al primo
     " ingrediente ".
     
     Questo era uno dei problemi
     della versione precedente.
  */

  let fine =
    testo.indexOf(
      " ingrediente ",
      inizio
    );


  /*
     Se non ci sono ingredienti dopo
     la quantità, cerchiamo gli altri
     campi possibili.
  */

  if(
    fine < 0
  ){

    fine =
      testo.indexOf(
        " scadenza prodotto ",
        inizio
      );

  }


  if(
    fine < 0
  ){

    fine =
      testo.indexOf(
        " note ",
        inizio
      );

  }


  if(
    fine >= 0
  ){

    return testo
      .substring(
        inizio,
        fine
      )
      .trim();

  }


  return testo
    .substring(
      inizio
    )
    .trim();

}


/* ============================================================
   ESTRAI INGREDIENTI
============================================================ */

function estraiIngredienti(testo){

  const risultato = [];


  const blocchi =
    testo.split(
      "ingrediente "
    );


  for(
    let i = 1;
    i < blocchi.length;
    i++
  ){

    let blocco =
      blocchi[i].trim();


    /*
       L'ingrediente termina prima
       di lotto / scadenza / note /
       ingrediente successivo.
    */

    let fine = blocco.length;


    const posLotto =
      blocco.indexOf(
        " lotto "
      );


    const posScadenza =
      blocco.indexOf(
        " scadenza "
      );


    const posNote =
      blocco.indexOf(
        " note "
      );


    const posIngrediente =
      blocco.indexOf(
        " ingrediente "
      );


    const posizioni = [
      posLotto,
      posScadenza,
      posNote,
      posIngrediente
    ]
    .filter(function(pos){
      return pos >= 0;
    });


    if(
      posizioni.length > 0
    ){

      fine =
        Math.min.apply(
          null,
          posizioni
        );

    }


    let nome =
      blocco
        .substring(
          0,
          fine
        )
        .trim();


    nome =
      nome.replace(
        /^e\s+/,
        ""
      );


    if(nome){

      risultato.push(nome);

    }

  }


  return risultato;

}


/* ============================================================
   ESTRAI LOTTI INGREDIENTI
============================================================ */

function estraiLotti(testo){

  const risultato = [];


  const blocchi =
    testo.split(
      "ingrediente "
    );


  for(
    let i = 1;
    i < blocchi.length;
    i++
  ){

    const blocco =
      blocchi[i];


    let lotto =
      "";


    const posizione =
      blocco.indexOf(
        " lotto "
      );


    if(
      posizione >= 0
    ){

      const inizio =
        posizione +
        " lotto ".length;


      let fine =
        blocco.length;


      const posScadenza =
        blocco.indexOf(
          " scadenza ",
          inizio
        );


      const posIngrediente =
        blocco.indexOf(
          " ingrediente ",
          inizio
        );


      const posNote =
        blocco.indexOf(
          " note ",
          inizio
        );


      const posScadenzaProdotto =
        blocco.indexOf(
          " scadenza prodotto ",
          inizio
        );


      const posizioni = [
        posScadenza,
        posIngrediente,
        posNote,
        posScadenzaProdotto
      ]
      .filter(function(pos){
        return pos >= 0;
      });


      if(
        posizioni.length > 0
      ){

        fine =
          Math.min.apply(
            null,
            posizioni
          );

      }


      lotto =
        blocco
          .substring(
            inizio,
            fine
          )
          .trim();

    }


    /*
       SEMPRE push.
       
       Se manca il lotto:
       push("")
       
       Questo mantiene l'allineamento.
    */

    risultato.push(
      lotto
    );

  }


  return risultato;

}


/* ============================================================
   ESTRAI SCADENZE INGREDIENTI
============================================================ */

function estraiScadenze(testo){

  const risultato = [];


  const blocchi =
    testo.split(
      "ingrediente "
    );


  for(
    let i = 1;
    i < blocchi.length;
    i++
  ){

    const blocco =
      blocchi[i];


    let scadenza =
      "";


    const posizione =
      blocco.indexOf(
        " scadenza "
      );


    /*
       IMPORTANTE:

       "scadenza prodotto" NON è
       una scadenza ingrediente.
    */

    const posizioneProdotto =
      blocco.indexOf(
        " scadenza prodotto "
      );


    if(
      posizione >= 0 &&
      posizione !== posizioneProdotto
    ){

      const inizio =
        posizione +
        " scadenza ".length;


      let fine =
        blocco.length;


      const posIngrediente =
        blocco.indexOf(
          " ingrediente ",
          inizio
        );


      const posNote =
        blocco.indexOf(
          " note ",
          inizio
        );


      const posScadenzaProdotto =
        blocco.indexOf(
          " scadenza prodotto ",
          inizio
        );


      const posizioni = [
        posIngrediente,
        posNote,
        posScadenzaProdotto
      ]
      .filter(function(pos){
        return pos >= 0;
      });


      if(
        posizioni.length > 0
      ){

        fine =
          Math.min.apply(
            null,
            posizioni
          );

      }


      scadenza =
        blocco
          .substring(
            inizio,
            fine
          )
          .trim();

    }


    /*
       SEMPRE push.
    */

    risultato.push(
      scadenza
    );

  }


  return risultato;

}


/* ============================================================
   SCADENZA PRODOTTO
============================================================ */

function estraiScadenzaProdotto(testo){

  let posizione =
    testo.indexOf(
      "scadenza prodotto "
    );


  if(
    posizione >= 0
  ){

    const inizio =
      posizione +
      "scadenza prodotto ".length;


    let fine =
      testo.length;


    const posIngrediente =
      testo.indexOf(
        " ingrediente ",
        inizio
      );


    const posNote =
      testo.indexOf(
        " note ",
        inizio
      );


    const posizioni = [
      posIngrediente,
      posNote
    ]
    .filter(function(pos){
      return pos >= 0;
    });


    if(
      posizioni.length > 0
    ){

      fine =
        Math.min.apply(
          null,
          posizioni
        );

    }


    return testo
      .substring(
        inizio,
        fine
      )
      .trim();

  }


  /*
     Se la voce ha perso "scadenza".
  */

  posizione =
    testo.indexOf(
      " prodotto "
    );


  if(
    posizione >= 0
  ){

    const inizio =
      posizione +
      " prodotto ".length;


    let fine =
      testo.length;


    const posIngrediente =
      testo.indexOf(
        " ingrediente ",
        inizio
      );


    const posNote =
      testo.indexOf(
        " note ",
        inizio
      );


    const posizioni = [
      posIngrediente,
      posNote
    ]
    .filter(function(pos){
      return pos >= 0;
    });


    if(
      posizioni.length > 0
    ){

      fine =
        Math.min.apply(
          null,
          posizioni
        );

    }


    return testo
      .substring(
        inizio,
        fine
      )
      .trim();

  }


  return "";

}


/* ============================================================
   NOTE
============================================================ */

function estraiNote(testo){

  const posizione =
    testo.indexOf(
      "note"
    );


  if(
    posizione < 0
  ){

    return "";

  }


  return testo
    .substring(
      posizione + 4
    )
    .trim();

}


/* ============================================================
   SALVA
============================================================ */

function salva(){

  /*
     Prendiamo il testo direttamente
     dal box.
  */

  const textarea =
    document.getElementById(
      "testo"
    );


  const testoBox =
    textarea.value.trim();


  if(
    !testoBox
  ){

    alert(
      "Prima fai una registrazione vocale."
    );

    return;

  }


  /*
     Se la registrazione è ancora
     attiva, la fermiamo.
  */

  if(
    registrazioneAttiva
  ){

    fermaVoce();

  }


  const testo =
    normalizzaTesto(
      testoBox
    );


  /* ========================================================
     ESTRAZIONE
  ======================================================== */

  const ingredienti =
    estraiIngredienti(testo);


  const lotti =
    estraiLotti(testo);


  const scadenze =
    estraiScadenze(testo);


  /*
     Allineamento di sicurezza.
  */

  while(
    lotti.length <
    ingredienti.length
  ){

    lotti.push("");

  }


  while(
    scadenze.length <
    ingredienti.length
  ){

    scadenze.push("");

  }


  lotti.length =
    ingredienti.length;


  scadenze.length =
    ingredienti.length;


  /* ========================================================
     DATI
  ======================================================== */

  const dati = {

    categoria:
      estraiCategoria(testo),

    produzione:
      estraiProduzione(testo),

    lotto:
      "",

    quantita:
      estraiQuantita(testo),

    ingrediente:
      ingredienti.join("|"),

    lottoIngrediente:
      lotti.join("|"),

    scadenzaIngrediente:
      scadenze.join("|"),

    scadenzaProdotto:
      estraiScadenzaProdotto(testo),

    note:
      estraiNote(testo)

  };


  /* ========================================================
     CONTROLLI
  ======================================================== */

  if(
    !dati.categoria
  ){

    alert(
      "Non ho riconosciuto la categoria."
    );

    return;

  }


  if(
    !dati.produzione
  ){

    alert(
      "Non ho riconosciuto il nome della produzione."
    );

    return;

  }


  if(
    ingredienti.length === 0
  ){

    alert(
      "Non ho riconosciuto nessun ingrediente."
    );

    return;

  }


  /* ========================================================
     BLOCCA SALVA
  ======================================================== */

  const bottone =
    document.getElementById(
      "bottoneSalva"
    );


  bottone.disabled =
    true;


  bottone.innerText =
    "SALVATAGGIO...";


  document
    .getElementById("stato")
    .innerText =
    "Salvataggio in corso...";


  /* ========================================================
     INVIO
  ======================================================== */

  fetch(
    URL_APPS_SCRIPT,
    {

      method:"POST",

      body:
        JSON.stringify(dati),

      headers:{
        "Content-Type":
          "text/plain;charset=utf-8"
      }

    }
  )


  .then(
    function(response){

      /*
         Leggiamo la risposta come testo
         prima di tentare JSON.

         Questo evita il problema che
         avevamo prima.
      */

      return response.text();

    }
  )


  .then(
    function(testoRisposta){

      console.log(
        "Risposta Apps Script:",
        testoRisposta
      );


      let risposta;


      try{

        risposta =
          JSON.parse(
            testoRisposta
          );

      }catch(e){

        /*
           Se Apps Script ha comunque
           risposto, consideriamo il
           salvataggio riuscito.
        */

        risposta = {
          successo:true
        };

      }


      if(
        risposta.successo === false
      ){

        throw new Error(
          risposta.errore ||
          "Errore durante il salvataggio."
        );

      }


      /* ==================================================
         SALVATAGGIO RIUSCITO
      ================================================== */


      /*
         SVUOTA IL BOX.
      */

      textarea.value =
        "";


      /*
         SVUOTA ANCHE LA MEMORIA
         DELLA REGISTRAZIONE.
      */

      testoRiconosciuto =
        "";


      /*
         Reset.
      */

      document
        .getElementById("stato")
        .innerText =
        "✅ Lotto salvato correttamente.";


      document
        .getElementById("bottoneParla")
        .innerText =
        "🎤 PARLA";


      alert(
        "Salvato"
      );

    }
  )


  .catch(
    function(e){

      console.error(e);


      document
        .getElementById("stato")
        .innerText =
        "❌ Errore durante il salvataggio.";


      alert(
        "Errore: " +
        e.message
      );

    }
  )


  .finally(
    function(){

      bottone.disabled =
        false;


      bottone.innerText =
        "SALVA";

    }
  );

}


/* ============================================================
   PULSANTE SALVA
============================================================ */

document
  .getElementById("bottoneSalva")
  .addEventListener(
    "click",
    salva
  );


</script>
