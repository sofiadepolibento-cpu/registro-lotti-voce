<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro Lotti</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
}

input, textarea {
  width:100%;
  padding:10px;
  margin-bottom:10px;
  font-size:16px;
}

button {
  width:100%;
  padding:15px;
  font-size:18px;
}
</style>

</head>

<body>

<h2>Registro Lotti</h2>

<button onclick="avviaVoce()">🎤 Parla</button>

<textarea id="testo" rows="8" placeholder="La dettatura comparirà qui"></textarea>

<button onclick="invia()">SALVA</button>


<script>

let testoRiconosciuto = "";


function avviaVoce(){

const riconoscimento = new webkitSpeechRecognition();

riconoscimento.lang="it-IT";

riconoscimento.continuous=false;


riconoscimento.onstart=function(){
alert("Parla ora");
};


riconoscimento.onresult=function(event){

testoRiconosciuto =
event.results[0][0].transcript;

document.getElementById("testo").value=testoRiconosciuto;

};


riconoscimento.onerror=function(event){

alert("Errore microfono: " + event.error);

};


riconoscimento.start();

}


function estraiDopo(testo,inizio,fine){

let parte="";

let a=testo.indexOf(inizio);

if(a>=0){

parte=testo.substring(a+inizio.length);

}

if(fine!=""){

let b=parte.indexOf(fine);

if(b>=0){

parte=parte.substring(0,b);

}

}

return parte.trim();

}
function invia(){

  const testo = testoRiconosciuto.toLowerCase();


const dati = {

produzione: estraiDopo(testo,"produzione","lotto"),

lotto: estraiDopo(testo,"lotto","quantità"),

quantita: estraiDopo(testo,"quantità","ingredienti"),

ingredienti: estraiDopo(testo,"ingredienti","scadenza prodotto"),

scadenza: estraiDopo(testo,"scadenza prodotto","note"),

note: estraiDopo(testo,"note","")

};

  fetch("https://script.google.com/macros/s/AKfycbz22zU9O2gsBLtlHZC92imCmLuO0haOaWNpge0j2rN3p7IlK8w2swFOCV2-Is6afqg/exec", {

    method: "POST",

    body: JSON.stringify(dati),

    headers: {
      "Content-Type": "text/plain"
    }

  })
  .then(response => response.text())
  .then(result => {

    alert("Dati inviati al registro");

  })
  .catch(error => {

    alert("Errore invio: " + error);

  });

};


  fetch("https://script.google.com/macros/s/AKfycbz22zU9O2gsBLtlHZC92imCmLuO0haOaWNpge0j2rN3p7IlK8w2swFOCV2-Is6afqg/exec", {

    method: "POST",

    body: JSON.stringify(dati),

    headers: {
      "Content-Type": "text/plain"
    }

  })
  .then(response => response.text())
  .then(result => {

    alert("Dati inviati al registro");

  })
  .catch(error => {

    alert("Errore invio: " + error);

  });

}

</script>

</body>
</html>
