<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registro Lotti</title>

<style>

body{
font-family:Arial;
padding:20px;
}

button{
width:100%;
padding:15px;
font-size:18px;
margin-bottom:15px;
}

textarea{
width:100%;
height:150px;
font-size:16px;
}

</style>

</head>


<body>

<h2 id="titolo">Registro Lotti</h2>

<button id="bottoneParla" onclick="avviaVoce()">
🎤 PARLA
</button>

<textarea id="testo" placeholder="Dettatura..."></textarea>

<button onclick="salva()">
SALVA
</button>


<script>


const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbz22zU9O2gsBLtlHZC92imCmLuO0haOaWNpge0j2rN3p7IlK8w2swFOCV2-Is6afqg/exec";


let testoRiconosciuto = "";



/* =========================
   AVVIO REGISTRAZIONE
========================= */

function avviaVoce(){

if(!("webkitSpeechRecognition" in window)){

alert("Browser non compatibile");

return;

}


const riconoscimento =
new webkitSpeechRecognition();


riconoscimento.lang = "it-IT";

riconoscimento.continuous = false;

riconoscimento.interimResults = false;



riconoscimento.onstart = function(){

alert("Parla ora");

};



riconoscimento.onresult = function(event){

testoRiconosciuto =
event.results[0][0].transcript;

document.getElementById("testo").value =
testoRiconosciuto;

};



riconoscimento.onerror = function(event){

alert("Errore microfono: " + event.error);

};



riconoscimento.start();

}



/* =========================
   PAGINA NUOVO LOTTO
========================= */

window.onload = function(){

const parametri =
new URLSearchParams(window.location.search);


if(parametri.get("azione") === "nuovo"){

document.getElementById("titolo").innerHTML =
"Nuovo lotto pronto";


document.getElementById("bottoneParla").innerHTML =
"🎤 AVVIA REGISTRAZIONE";

}

};



/* =========================
   NORMALIZZAZIONE TESTO
========================= */

function normalizzaTesto(testo){

testo = testo.toLowerCase();


/* produzione */

testo = testo.replaceAll(
"produzioni",
"produzione"
);


/* ingredienti */

testo = testo.replaceAll(
"ingredienti",
"ingrediente"
);

testo = testo.replaceAll(
"nuovi ingredienti",
"nuovo ingrediente"
);

testo = testo.replaceAll(
"nuovi ingrediente",
"nuovo ingrediente"
);

testo = testo.replaceAll(
"nuova ingrediente",
"nuovo ingrediente"
);


/* lotto pronunciato male */

testo = testo.replaceAll(
"l'otto",
"lotto"
);

testo = testo.replaceAll(
"l otto",
"lotto"
);

testo = testo.replaceAll(
"l'8",
"lotto"
);

testo = testo.replaceAll(
"l 8",
"lotto"
);

testo = testo.replaceAll(
" l8 ",
" lotto "
);


/* eventuale "lottof123" */

testo = testo.replaceAll(
"lottof",
"lotto f"
);

testo = testo.replaceAll(
"lottol",
"lotto l"
);


/* errore tipico del riconoscimento:
   "ingrediente e lievito"
   diventa "ingrediente lievito"
*/

testo = testo.replaceAll(
"ingrediente e ",
"ingrediente "
);


/* elimina collegamenti inutili */

testo = testo.replaceAll(
" e anche ",
" "
);


return testo.trim();

}



/* =========================
   ESTRAZIONE PRODUZIONE
========================= */

function estraiProduzione(testo){

let posizione =
testo.indexOf("produzione");

if(posizione < 0){
return "";
}

let inizio =
posizione + "produzione".length;

let fine =
testo.indexOf("quantità", inizio);

if(fine < 0){
return "";
}

return testo
.substring(inizio, fine)
.trim();

}


/* =========================
   ESTRAZIONE QUANTITÀ
========================= */

function estraiQuantita(testo){

let risultato = "";

let posizione =
testo.indexOf("quantità ");

if(posizione < 0){
return "";
}

let inizio =
posizione + "quantità ".length;

let fine =
testo.indexOf(" scadenza prodotto ", inizio);

if(fine < 0){

fine =
testo.indexOf(" prodotto ", inizio);

}

if(fine >= 0){

risultato =
testo.substring(inizio, fine);

}else{

risultato =
testo.substring(inizio);

}

return risultato.trim();

}



/* =========================
   ESTRAZIONE INGREDIENTI
========================= */

function estraiIngredienti(testo){

let risultato = [];

let blocchi =
testo.split("ingrediente ");


for(let i = 1; i < blocchi.length; i++){

let blocco =
blocchi[i].trim();


let nome =
blocchi[i]
.split(" lotto ")[0]
.trim();


/* elimina eventuale "e" iniziale */

nome =
nome.replace(/^e\s+/,"");


if(nome !== ""){

risultato.push(nome);

}

}


return risultato;

}



/* =========================
   ESTRAZIONE LOTTI INGREDIENTI
========================= */

function estraiLotti(testo){

let risultato = [];

let blocchi =
testo.split("ingrediente ");


for(let i = 1; i < blocchi.length; i++){

let blocco =
blocchi[i];


let parti =
blocco.split(" lotto ");


if(parti.length > 1){

let lotto =
parti[1]
.split(" scadenza ")[0]
.trim();


if(lotto !== ""){

risultato.push(lotto);

}

}

}


return risultato;

}



/* =========================
   ESTRAZIONE SCADENZE INGREDIENTI
========================= */

function estraiScadenze(testo){

let risultato = [];

let blocchi =
testo.split("ingrediente ");


for(let i = 1; i < blocchi.length; i++){

let blocco =
blocchi[i];


let parti =
blocco.split(" scadenza ");


if(parti.length > 1){

let scadenza =
parti[1];


scadenza =
scadenza
.split(" ingrediente ")[0];


scadenza =
scadenza
.split(" scadenza prodotto ")[0];


scadenza =
scadenza
.split(" note ")[0];


scadenza =
scadenza.trim();


if(scadenza !== ""){

risultato.push(scadenza);

}

}

}


return risultato;

}



/* =========================
   FUNZIONE GENERALE
========================= */

function estraiTra(testo,inizio,fine){

let posizioneInizio =
testo.indexOf(inizio);


if(posizioneInizio < 0){

return "";

}


let inizioTesto =
posizioneInizio + inizio.length;


let posizioneFine =
testo.indexOf(
fine,
inizioTesto
);


if(posizioneFine < 0){

return testo
.substring(inizioTesto)
.trim();

}


return testo
.substring(
inizioTesto,
posizioneFine
)
.trim();

}



/* =========================
   SALVATAGGIO
========================= */

function estraiScadenzaProdotto(testo){

let risultato = "";

let posizione =
testo.indexOf("scadenza prodotto ");

if(posizione >= 0){

let inizio =
posizione + "scadenza prodotto ".length;

let fine =
testo.indexOf(" ingrediente ", inizio);

if(fine < 0){
fine = testo.indexOf(" note ", inizio);
}

if(fine >= 0){
risultato = testo.substring(inizio, fine);
}else{
risultato = testo.substring(inizio);
}

return risultato.trim();

}


/* Se la voce ha perso "scadenza" e rimane solo "prodotto" */

posizione =
testo.indexOf(" prodotto ");

if(posizione >= 0){

let inizio =
posizione + " prodotto ".length;

let fine =
testo.indexOf(" ingrediente ", inizio);

if(fine < 0){
fine = testo.indexOf(" note ", inizio);
}

if(fine >= 0){
risultato = testo.substring(inizio, fine);
}else{
risultato = testo.substring(inizio);
}

}

return risultato.trim();

}
function estraiNote(testo){

let posizione = testo.indexOf("note");

if(posizione < 0){
return "";
}

let risultato =
testo.substring(posizione + 4).trim();

return risultato;

}   
function salva(){

if(!testoRiconosciuto){

alert("Prima fai una registrazione vocale.");

return;

}


let testo =
normalizzaTesto(testoRiconosciuto);



/* DATI */

const dati = {


produzione:
estraiProduzione(testo),


/*
Il lotto della produzione
NON viene più preso dalla voce.

Code.gs lo calcola automaticamente.
*/

lotto:
"",


quantita:
estraiQuantita(testo),


ingrediente:
estraiIngredienti(testo).join("|"),


lottoIngrediente:
estraiLotti(testo).join("|"),


scadenzaIngrediente:
estraiScadenze(testo).join("|"),


scadenzaProdotto: estraiScadenzaProdotto(testo),


note: estraiNote(testo),

};



/* =========================
   INVIO A GOOGLE APPS SCRIPT
========================= */

fetch(
URL_APPS_SCRIPT,
{

method:"POST",

body:JSON.stringify(dati),

headers:{
"Content-Type":"text/plain"
}

}
)


.then(function(r){

return r.text();

})


.then(function(){

alert("Salvato");

})


.catch(function(e){

alert("Errore: " + e);

});

}


</script>

</body>

</html>
