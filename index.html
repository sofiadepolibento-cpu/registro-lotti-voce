<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro Lotti</title>

<style>
body{
font-family:Arial;
padding:20px;
}

button{
width:100%;
padding:15px;
font-size:18px;
margin-bottom:15px;
}

textarea{
width:100%;
height:150px;
font-size:16px;
}
</style>

</head>

<body>

<h2>Registro Lotti</h2>

<button onclick="avviaVoce()">🎤 PARLA</button>

<textarea id="testo" placeholder="Dettatura..."></textarea>

<button onclick="salva()">SALVA</button>


<script>

const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbz22zU9O2gsBLtlHZC92imCmLuO0haOaWNpge0j2rN3p7IlK8w2swFOCV2-Is6afqg/exec";


let testoRiconosciuto="";


function avviaVoce(){

if(!("webkitSpeechRecognition" in window)){
alert("Browser non compatibile");
return;
}

const riconoscimento = new webkitSpeechRecognition();

riconoscimento.lang="it-IT";
riconoscimento.continuous=false;
riconoscimento.interimResults=false;


riconoscimento.onstart=function(){
alert("Parla ora");
};


riconoscimento.onresult=function(event){

testoRiconosciuto = event.results[0][0].transcript;

document.getElementById("testo").value=testoRiconosciuto;

alert(testoRiconosciuto);

};

riconoscimento.onerror=function(event){

alert("Errore microfono: " + event.error);

};


riconoscimento.start();

}

window.onload=function(){

const parametri = new URLSearchParams(window.location.search);

if(parametri.get("azione")=="nuovo"){

document.querySelector("h2").innerHTML="Nuovo lotto pronto";

document.querySelector("button").innerHTML="🎤 AVVIA REGISTRAZIONE";

}

};
  
function estrai(testo,inizio,fine){

let risultato="";

let a=testo.indexOf(inizio);

if(a>=0){

risultato=testo.substring(a+inizio.length);

}

if(fine!=""){

let b=risultato.indexOf(fine);

if(b>=0){

risultato=risultato.substring(0,b);

}

}

return risultato.trim();

}

function estraiIngredienti(testo){

let risultato=[];

let blocchi=testo.split("ingrediente ");

for(let i=1;i<blocchi.length;i++){

let b=blocchi[i];

let nome=b.split(" lotto ")[0].trim();

risultato.push(nome);

}

return risultato;

}



function estraiLotti(testo){

let risultato=[];

let blocchi=testo.split("ingrediente ");

for(let i=1;i<blocchi.length;i++){

let b=blocchi[i];

let parti=b.split(" lotto ");

if(parti.length>1){

let lotto=parti[1].split(" scadenza ")[0].trim();

risultato.push(lotto);

}

}

return risultato;

}



function estraiScadenze(testo){

let risultato=[];

let blocchi=testo.split("ingrediente ");

for(let i=1;i<blocchi.length;i++){

let b=blocchi[i];

let parti=b.split(" scadenza ");

if(parti.length>1){

let sc=parti[1];

sc=sc.split(" ingrediente ")[0];
sc=sc.split(" scadenza prodotto ")[0];
sc=sc.split(" note ")[0];

risultato.push(sc.trim());

}

}

return risultato;

}

function salva(){

let testo = testoRiconosciuto.toLowerCase();
testo = testo.replaceAll(" e anche "," ");

testo = testo.replaceAll("produzioni","produzione");
testo = testo.replaceAll("ingredienti","ingrediente");
testo = testo.replaceAll("nuovi ingrediente","nuovo ingrediente");
testo = testo.replaceAll("nuovi ingredienti","nuovo ingrediente");
testo = testo.replaceAll("nuova ingrediente","nuovo ingrediente");
testo = testo.replaceAll("ingredienti e ","ingrediente ");

testo = testo.replaceAll("l'otto","lotto");
testo = testo.replaceAll("l otto","lotto");
testo = testo.replaceAll("l'8","lotto");
testo = testo.replaceAll("l 8","lotto");
testo = testo.replaceAll(" l8 "," lotto ");
testo = testo.replaceAll("l 8 ","lotto ");

const dati={

produzione: estrai(testo,"produzione","lotto"),

lotto: estrai(testo,"lotto","quantità"),

quantita: estrai(testo,"quantità","scadenza prodotto"),

ingrediente: estraiIngredienti(testo).join("|"),

lottoIngrediente: estraiLotti(testo).join("|"),

scadenzaIngrediente: estraiScadenze(testo).join("|"),

scadenzaProdotto: estrai(testo,"scadenza prodotto","ingrediente"),

note: estrai(testo,"note","")

};


fetch(URL_APPS_SCRIPT,{

method:"POST",

body:JSON.stringify(dati),

headers:{
"Content-Type":"text/plain"
}

})

.then(r=>r.text())

.then(()=>{

alert("Salvato");

})

.catch(e=>{

alert("Errore: "+e);

});

}

window.onload=function(){

const parametri = new URLSearchParams(window.location.search);

if(parametri.get("azione")=="nuovo"){

document.querySelector("h2").innerHTML="Nuovo lotto pronto";

document.querySelector("button").innerHTML="🎤 AVVIA REGISTRAZIONE";

}

};
  
</script>

</body>

</html>
